name: Deploy to Development Server

on:
  push:
    branches: [ "production" ]
  workflow_dispatch:

jobs:
  CI:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "zulu"

      - name: Gradle Caching
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: dndteam9/gak:latest

  CD:
    needs: CI
    runs-on: ubuntu-latest

    env:
      APP_PATH: ${{ secrets.APP_PATH }}

    steps:
      # ==================================================
      # OCI CLI 설치
      # ==================================================

      - name: Install OCI CLI
        run: |
          python -m pip install --upgrade pip
          pip install oci-cli

      # ==================================================
      # OCI CLI 인증 설정
      # ==================================================

      - name: Configure OCI CLI
        run: |
          mkdir -p ~/.oci

          printf '%s' "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=~/.oci/oci_api_key.pem
          EOF

          chmod 600 ~/.oci/config

      # ==================================================
      # OCI 인증 및 NLB 정보 확인
      # ==================================================

      - name: Verify OCI Authentication
        run: |
          echo "Checking OCI authentication..."
          oci iam user get \
            --user-id "${{ secrets.OCI_USER_OCID }}"

      - name: Check NLB
        run: |
          echo "Checking NLB..."
          oci nlb network-load-balancer get \
            --network-load-balancer-id "${{ secrets.NLB_OCID }}"

      - name: Check Backend Sets
        run: |
          echo "Checking Backend Sets..."
          oci nlb backend-set list \
            --network-load-balancer-id "${{ secrets.NLB_OCID }}"

      - name: Check Backends
        run: |
          echo "Checking Backends..."
          oci nlb backend list \
            --network-load-balancer-id "${{ secrets.NLB_OCID }}" \
            --backend-set-name "${{ secrets.NLB_BACKEND_SET_NAME }}"

      # ==================================================
      # Server-1 NLB에서 제외
      # ==================================================

      - name: Take Server-1 Offline
        run: |
          oci nlb backend update \
            --network-load-balancer-id "${{ secrets.NLB_OCID }}" \
            --backend-set-name "${{ secrets.NLB_BACKEND_SET_NAME }}" \
            --backend-name "${{ secrets.SERVER_1_BACKEND_NAME }}" \
            --is-offline true

      # ==================================================
      # Server-1 배포
      # ==================================================

      - name: Deploy Server-1
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.INSTANCE_HOST }}
          username: ${{ secrets.INSTANCE_USER }}
          key: ${{ secrets.SECRET_KEY }}
          script: |
            set -e

            cd ${{ env.APP_PATH }}

            docker pull dndteam9/gak:latest
            docker compose up -d --no-deps gak-server
            docker image prune -f

      # ==================================================
      # Server-1 Health Check
      # ==================================================

      - name: Health Check Server-1
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.INSTANCE_HOST }}
          username: ${{ secrets.INSTANCE_USER }}
          key: ${{ secrets.SECRET_KEY }}
          script: |
            set -e

            echo "Waiting for Server-1..."

            for i in {1..120}; do
              if curl -sf http://localhost:8080/health > /dev/null; then
                echo "Server-1 is healthy."
                exit 0
              fi

              echo "Health check failed. Retry $i/120..."
              sleep 2
            done

            echo "Server-1 health check failed."
            exit 1

      # ==================================================
      # Server-1 NLB 복귀
      # ==================================================

      - name: Bring Server-1 Online
        run: |
          oci nlb backend update \
            --network-load-balancer-id "${{ secrets.NLB_OCID }}" \
            --backend-set-name "${{ secrets.NLB_BACKEND_SET_NAME }}" \
            --backend-name "${{ secrets.SERVER_1_BACKEND_NAME }}" \
            --is-offline false

      # ==================================================
      # Server-2 NLB에서 제외
      # ==================================================

      - name: Take Server-2 Offline
        run: |
          oci nlb backend update \
            --network-load-balancer-id "${{ secrets.NLB_OCID }}" \
            --backend-set-name "${{ secrets.NLB_BACKEND_SET_NAME }}" \
            --backend-name "${{ secrets.SERVER_2_BACKEND_NAME }}" \
            --is-offline true

      # ==================================================
      # Server-2 배포
      # ==================================================

      - name: Deploy Server-2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.INSTANCE_HOST_2 }}
          username: ${{ secrets.INSTANCE_USER_2 }}
          key: ${{ secrets.SECRET_KEY_2 }}
          script: |
            set -e

            cd ${{ env.APP_PATH }}

            docker pull dndteam9/gak:latest
            docker compose up -d --no-deps gak-server
            docker image prune -f

      # ==================================================
      # Server-2 Health Check
      # ==================================================

      - name: Health Check Server-2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.INSTANCE_HOST_2 }}
          username: ${{ secrets.INSTANCE_USER_2 }}
          key: ${{ secrets.SECRET_KEY_2 }}
          script: |
            set -e

            echo "Waiting for Server-2..."

            for i in {1..120}; do
              if curl -sf http://localhost:8080/health > /dev/null; then
                echo "Server-2 is healthy."
                exit 0
              fi

              echo "Health check failed. Retry $i/120..."
              sleep 2
            done

            echo "Server-2 health check failed."
            exit 1

      # ==================================================
      # Server-2 NLB 복귀
      # ==================================================

      - name: Bring Server-2 Online
        run: |
          oci nlb backend update \
            --network-load-balancer-id "${{ secrets.NLB_OCID }}" \
            --backend-set-name "${{ secrets.NLB_BACKEND_SET_NAME }}" \
            --backend-name "${{ secrets.SERVER_2_BACKEND_NAME }}" \
            --is-offline false